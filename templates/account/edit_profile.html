{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content1 %}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12 animate-fade-in">
    <!-- Header text -->
    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-[1.25rem] bg-indigo-50 text-indigo-600 mb-5 border border-indigo-100 shadow-sm">
            <i class="bi bi-pencil-fill text-2xl"></i>
        </div>
        <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight" style="font-family:'Outfit',sans-serif;">
            Edit Profile
        </h2>
        <p class="text-gray-500 mt-3 text-lg">Update your personal information and account preferences.</p>
    </div>

    <!-- Form container -->
    <div class="bg-white rounded-[2rem] shadow-xl border border-gray-100 overflow-hidden relative">
        <!-- Decorative bg elements -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-50/70 rounded-full mix-blend-multiply filter blur-3xl translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-64 h-64 bg-purple-50/70 rounded-full mix-blend-multiply filter blur-3xl -translate-x-1/2 translate-y-1/2 pointer-events-none"></div>

        <div class="p-8 sm:p-10 relative z-10">
            <form method="post" class="needs-validation" novalidate>
                {% csrf_token %}
                
                <div class="form-input-tw space-y-6">
                    {{ form|crispy }}
                </div>

                <div class="mt-10 flex flex-col-reverse sm:flex-row items-center justify-end gap-3 pt-8 border-t border-gray-100/80">
                    <a href="{% url 'class_timetable:dashboard' %}" class="w-full sm:w-auto px-6 py-3 bg-white border-2 border-gray-200 text-gray-700 font-bold rounded-xl hover:bg-gray-50 hover:border-gray-300 transition-all text-center">
                        Cancel
                    </a>
                    <button type="submit" class="w-full sm:w-auto px-8 py-3 btn-indigo text-white font-bold rounded-xl transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                        <i class="bi bi-check-circle-fill"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
