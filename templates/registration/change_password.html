{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content1 %}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-10 px-4">
  <div class="w-full max-w-md animate-slide-up">

    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
      <div class="h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-violet-500"></div>
      <div class="p-8">
        <div class="text-center mb-7">
          <div class="w-14 h-14 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <i class="bi bi-shield-lock text-indigo-600 text-2xl"></i>
          </div>
          <h2 class="text-2xl font-bold text-gray-900" style="font-family:'Outfit',sans-serif;">🔒 Change Password</h2>
          <p class="text-gray-500 text-sm mt-1">Keep your account secure</p>
        </div>

        <form method="post" novalidate class="form-input-tw">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn-indigo w-full py-3 text-sm mt-3 rounded-full">
            Update Password
          </button>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
